<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Point Incremential 2</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #08120d;
        color: #edfdf5;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 48px 20px;
      }
      h1 {
        font-size: 52px;
        margin: 0 0 14px;
        line-height: 1.1;
      }
      p {
        color: #cde9d7;
        line-height: 1.7;
      }
      .button {
        display: inline-block;
        margin-top: 18px;
        background: #4bdc13;
        color: #07160d;
        text-decoration: none;
        font-weight: bold;
        padding: 12px 18px;
        border-radius: 10px;
      }
      .panel {
        background: #0e1d17;
        border: 1px solid #234134;
        border-radius: 14px;
        padding: 22px;
        margin-top: 28px;
      }
      ul {
        margin: 0;
        padding-left: 18px;
        color: #d5f4df;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Point Incremential 2</h1>
      <p>
        Endgame 1e10 Points. A prestige-based incremental game focused on
        multiplication, automation, upgrades, and sustained progress.
      </p>
      <a class="button" href="https://github.com/Spotky2010-ops/Point-incremential-2" target="_blank">
        View Repository
      </a>

      <div class="panel">
        <h2>Features</h2>
        <ul>
          <li>Prestige mechanics</li>
          <li>Upgrade boosters</li>
          <li>Auto prestige system</li>
          <li>Endgame progression toward 1e10</li>
        </ul>
      </div>
    </div>
  </body>
</html>
